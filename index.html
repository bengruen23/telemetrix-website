<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TELEMETRIX</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;800&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg-base:        #0a0a0c;
    --bg-elevated:    #15161a;
    --ink-primary:    #f4f1ea;
    --ink-secondary:  rgba(244, 241, 234, 0.65);
    --rule-strong:    rgba(244, 241, 234, 0.20);
    --accent:         #e8924a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: var(--ink-primary);
    background: var(--bg-base);
    -webkit-font-smoothing: antialiased;
    overflow: hidden; /* Prevent scrolling, we want a full-screen app feel */
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Nav ---------- */
  .nav {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 1.5rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 100;
  }
  .nav__brand {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.875rem;
    letter-spacing: 0.18em;
    font-weight: 500;
  }
  .nav__cta {
    font-size: 0.875rem;
    border: 1px solid var(--rule-strong);
    padding: 0.5rem 1rem;
    border-radius: 999px;
    text-decoration: none;
    color: var(--ink-primary);
    transition: border-color 150ms;
  }
  .nav__cta:hover { border-color: var(--accent); }

  /* ---------- The Audio Visualizer Container ---------- */
  .visualizer-container {
    position: relative;
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* The Native Canvas */
  #visualizer-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  /* Dark Vignette Overlay */
  .vignette {
    position: absolute;
    inset: 0;
    z-index: 2;
    background: radial-gradient(circle at center, transparent 30%, var(--bg-base) 100%);
    pointer-events: none;
  }

  /* ---------- The Player UI ---------- */
  .player-ui {
    position: absolute;
    bottom: 3rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
    width: 100%;
    max-width: 600px;
    padding: 0 2rem;
  }

  .episode-meta {
    text-align: center;
  }
  .episode-tag {
    font-family: 'JetBrains Mono', monospace;
    color: var(--accent);
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    margin-bottom: 0.5rem;
  }
  .episode-title {
    font-size: 2rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--ink-primary);
  }

  /* Custom Progress Bar */
  .progress-container {
    width: 100%;
    height: 4px;
    background: var(--rule-strong);
    border-radius: 2px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.1s linear;
  }

  /* Minimalist Controls */
  .controls {
    display: flex;
    align-items: center;
    gap: 2rem;
  }
  .play-btn {
    background: transparent;
    border: 1px solid var(--ink-secondary);
    border-radius: 50%;
    width: 64px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .play-btn:hover {
    border-color: var(--accent);
    transform: scale(1.05);
  }
  
  /* Pure CSS Play/Pause Icons */
  .icon-play {
    width: 0; 
    height: 0; 
    border-top: 10px solid transparent;
    border-bottom: 10px solid transparent;
    border-left: 16px solid var(--ink-primary);
    margin-left: 6px;
    transition: border-color 0.2s;
  }
  .icon-pause {
    width: 16px;
    height: 20px;
    border-left: 5px solid var(--ink-primary);
    border-right: 5px solid var(--ink-primary);
    transition: border-color 0.2s;
  }
  .play-btn:hover .icon-play { border-left-color: var(--accent); }
  .play-btn:hover .icon-pause { border-left-color: var(--accent); border-right-color: var(--accent); }

  /* Time Display */
  .time-display {
    width: 100%;
    display: flex;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--ink-secondary);
    margin-top: -1rem;
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav__brand">TELEMETRIX</div>
  <a href="#" class="nav__cta">Record with us</a>
</nav>

<div class="visualizer-container">
  <canvas id="visualizer-canvas"></canvas>
  <div class="vignette"></div>

  <div class="player-ui">
    <div class="episode-meta">
      <div class="episode-tag">TX-001 // FIRST TRANSMISSION</div>
      <div class="episode-title">The Physical AI Bottleneck</div>
    </div>

    <div class="progress-container" id="progress-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    
    <div class="time-display">
      <span id="current-time">00:00</span>
      <span id="duration">00:00</span>
    </div>

    <div class="controls">
      <button class="play-btn" id="play-btn">
        <div class="icon-play" id="play-icon"></div>
      </button>
    </div>
  </div>
</div>

<audio id="audio-source" src="episode-001.mp3" crossorigin="anonymous"></audio>

<script>
  /**
   * THE BRAINS: Native Audio API + Canvas Renderer
   */
  const audio = document.getElementById('audio-source');
  const playBtn = document.getElementById('play-btn');
  const playIcon = document.getElementById('play-icon');
  const progressBar = document.getElementById('progress-bar');
  const progressContainer = document.getElementById('progress-container');
  const currentTimeEl = document.getElementById('current-time');
  const durationEl = document.getElementById('duration');

  const canvas = document.getElementById('visualizer-canvas');
  const ctx = canvas.getContext('2d');

  let audioContext, analyser, dataArray;
  let isPlaying = false;
  let isInitialized = false;

  // --- Canvas Setup ---
  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // --- Audio Initialization ---
  function initAudio() {
    if (isInitialized) return;
    
    // Create the Web Audio API context
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioContext.createAnalyser();
    
    // Connect the hidden <audio> element to the analyzer
    const source = audioContext.createMediaElementSource(audio);
    source.connect(analyser);
    analyser.connect(audioContext.destination);

    // Determines how detailed the frequency data is
    analyser.fftSize = 256;
    const bufferLength = analyser.frequencyBinCount;
    dataArray = new Uint8Array(bufferLength);

    isInitialized = true;
    renderVisualizer();
  }

  // --- The Renderer (The "Orange Thing Going Crazy") ---
  function renderVisualizer() {
    requestAnimationFrame(renderVisualizer);

    // Get current frequency data from the playing audio
    analyser.getByteFrequencyData(dataArray);

    // Clear the canvas
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    
    // Base radius of the circle
    const baseRadius = window.innerWidth < 768 ? 100 : 150;

    // Draw the frequency ring
    ctx.beginPath();
    
    // Loop through the data points to create a circular path
    for (let i = 0; i < dataArray.length; i++) {
      // Normalize data (0 to 1)
      const value = dataArray[i] / 255;
      
      // Calculate angle (spread evenly around a circle)
      const angle = (i / dataArray.length) * Math.PI * 2;
      
      // Calculate how far out this point spikes based on the bass/treble
      const spikeFactor = value * 150; // The multiplier for the "crazy" effect
      const radius = baseRadius + spikeFactor;

      const x = centerX + Math.cos(angle) * radius;
      const y = centerY + Math.sin(angle) * radius;

      if (i === 0) {
        ctx.moveTo(x, y);
      } else {
        // Connect the dots
        ctx.lineTo(x, y);
      }
    }
    
    ctx.closePath();
    
    // Styling the line
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#e8924a'; // Your accent orange
    
    // Add a glowing effect
    ctx.shadowBlur = 20;
    ctx.shadowColor = 'rgba(232, 146, 74, 0.8)';
    
    ctx.stroke();

    // Reset shadow for performance
    ctx.shadowBlur = 0;
  }

  // --- Controls & UI Logic ---
  
  // Format time (e.g., 65s -> 01:05)
  function formatTime(seconds) {
    if (isNaN(seconds)) return "00:00";
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
  }

  // Play/Pause Toggle
  playBtn.addEventListener('click', () => {
    initAudio(); // Must be initialized on user interaction

    // Handle suspended state (browser autoplay policy)
    if (audioContext.state === 'suspended') {
      audioContext.resume();
    }

    if (isPlaying) {
      audio.pause();
      playIcon.className = "icon-play";
    } else {
      audio.play();
      playIcon.className = "icon-pause";
    }
    isPlaying = !isPlaying;
  });

  // Update Progress Bar
  audio.addEventListener('timeupdate', () => {
    const percent = (audio.currentTime / audio.duration) * 100;
    progressBar.style.width = `${percent}%`;
    currentTimeEl.textContent = formatTime(audio.currentTime);
  });

  // Load Duration
  audio.addEventListener('loadedmetadata', () => {
    durationEl.textContent = formatTime(audio.duration);
  });

  // Click to scrub/seek
  progressContainer.addEventListener('click', (e) => {
    const width = progressContainer.clientWidth;
    const clickX = e.offsetX;
    const duration = audio.duration;
    audio.currentTime = (clickX / width) * duration;
  });

</script>
</body>
</html>
